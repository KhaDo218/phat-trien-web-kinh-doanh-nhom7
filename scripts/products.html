<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Nội thất cho không gian của bạn - RoomCraft</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style type="text/css">
            @import url(css/base.css);
            @import url(css/components/product-card.css);
            @import url(css/pages/products.css);
        </style>
        <script src="js/core/utils.js"></script>
        <script src="js/core/store.js"></script>
        <script src="js/core/auth.js"></script>
        <script src="components/header.js"></script>
        <script src="components/footer.js"></script>
        <script src="components/chatbot.js"></script>
        <script src="components/product-card.js"></script>
        <script src="js/services/products.js"></script>
        <script src="js/pages/products.js"></script>
    </head>
    <body>
        <div id="header"></div>

        <main class="container">
            <div class="breadcrumb"><a href="index.html">Trang chủ</a><span>/</span>Nội thất cho không gian của bạn</div>
            <section class="catalog-heading">
                <div>
                    <p class="overline">Bộ sưu tập kiến trúc tuyển chọn</p>
                    <h1 class="headline-page">Nội thất cho không gian của bạn</h1>
                </div>
                <p class="catalog-note">Kiến trúc · Thủ công đương đại · Tinh chỉnh tỉ lệ</p>
            </section>

            <nav class="style-filter" id="styleFilter" aria-label="Lọc theo phong cách"></nav>

            <div class="catalog-layout">
                <aside class="catalog-filters card" aria-label="Bộ lọc sản phẩm">
                    <div class="catalog-filter-heading">
                        <h2 class="overline">Bộ lọc tuyển chọn</h2>
                        <a class="btn-link" href="products.html">Thiết lập lại</a>
                    </div>
                    <form id="frmCatalogFilters" onsubmit="return applyCatalogFilters(event)">
                        <div class="form-group">
                            <label for="txtCatalogSearch">Tìm kiếm</label>
                            <input class="input" type="search" id="txtCatalogSearch" placeholder="Tên sản phẩm, thương hiệu...">
                        </div>
                        <div class="catalog-filter-section">
                            <h3 class="overline">Danh mục</h3>
                            <select class="input" id="cboCatalogCategory">
                                <option value="">Tất cả danh mục</option>
                            </select>
                        </div>
                        <div class="catalog-filter-section">
                            <h3 class="overline">Khoảng giá (₫)</h3>
                            <div class="price-range-fields">
                                <label for="txtMinPrice">Từ</label>
                                <input class="input" type="number" id="txtMinPrice" min="0" placeholder="Giá thấp nhất">
                                <label for="txtMaxPrice">Đến</label>
                                <input class="input" type="number" id="txtMaxPrice" min="0" placeholder="Giá cao nhất">
                            </div>
                        </div>
                        <button class="btn btn-outline btn-full" type="submit">Áp dụng bộ lọc</button>
                    </form>
                </aside>

                <section class="catalog-results" aria-label="Kết quả sản phẩm">
                    <div class="catalog-toolbar">
                        <p><strong id="productCount">0 sản phẩm</strong><span class="text-secondary"> · Kết quả tuyển chọn</span></p>
                        <label class="catalog-sort">
                            <span class="text-secondary">Sắp xếp theo:</span>
                            <select class="input" id="cboProductSort" onchange="changeProductSort()">
                                <option value="default">Mặc định</option>
                                <option value="price-asc">Giá: thấp đến cao</option>
                                <option value="price-desc">Giá: cao đến thấp</option>
                                <option value="name-asc">Tên: A đến Z</option>
                            </select>
                        </label>
                    </div>
                    <div class="grid-4 product-grid" id="productGrid" aria-live="polite"></div>
                    <section class="empty-suggestions hidden" id="emptySuggestions">
                        <p class="overline">Gợi ý dành cho bạn</p>
                        <h2 class="headline-section">Có thể bạn cũng thích</h2>
                        <div class="grid-4" id="relatedProducts"></div>
                    </section>
                    <nav class="catalog-pagination" id="catalogPagination" aria-label="Phân trang"></nav>
                </section>
            </div>

        </main>

        <div id="footer"></div>

        <script>
            loadData(initPage);
        </script>
    </body>
</html>
