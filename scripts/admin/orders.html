<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Quản lý đơn hàng - Quản trị RoomCraft</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style type="text/css">
            @import url(../css/base.css);
            @import url(../css/admin.css);
            @import url(../css/pages/admin-orders.css);
        </style>
        <script src="../js/core/utils.js"></script>
        <script src="../js/core/store.js"></script>
        <script src="../js/core/auth.js"></script>
        <script src="../components/admin-sidebar.js"></script>
        <script src="../js/services/orders.js"></script>
        <script src="../js/services/shipping.js"></script>
        <script src="../js/pages/admin-orders.js"></script>
    </head>
    <body>
        <div id="admin">
            <div id="sidebar"></div>
            <main class="admin-main">
                <div class="admin-head">
                    <p class="overline">Quản trị</p>
                    <h1 class="headline-section">Quản lý đơn hàng</h1>
                </div>

                <div class="toolbar">
                    <input class="input" type="text" id="txtSearch" placeholder="Tìm theo mã đơn, tên khách..." onkeyup="showOrders()">
                    <select class="input" id="cboStatus" onchange="showOrders()">
                        <option value="">Tất cả trạng thái</option>
                        <option value="Confirmed">Đã xác nhận</option>
                        <option value="Packing">Đang đóng gói</option>
                        <option value="Shipping">Đang giao hàng</option>
                        <option value="Delivered">Đã giao</option>
                        <option value="Cancelled">Đã hủy</option>
                    </select>
                </div>

                <table class="table">
                    <thead>
                        <tr>
                            <th>Mã đơn</th>
                            <th>Khách hàng</th>
                            <th>Sản phẩm</th>
                            <th>Ngày đặt</th>
                            <th>Tổng tiền</th>
                            <th>Thanh toán</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="tbOrders"></tbody>
                </table>
                <div class="admin-pager" id="pgOrders"></div>

            </main>
        </div>

        <script>
            loadData(initPage);
        </script>
    </body>
</html>
