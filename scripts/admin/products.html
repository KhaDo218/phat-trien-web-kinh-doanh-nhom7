<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Quản lý sản phẩm - Quản trị RoomCraft</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style type="text/css">
            @import url(../css/base.css);
            @import url(../css/admin.css);
            @import url(../css/pages/admin-products.css);
        </style>
        <script src="../js/core/utils.js"></script>
        <script src="../js/core/store.js"></script>
        <script src="../js/core/auth.js"></script>
        <script src="../components/admin-sidebar.js"></script>
        <script src="../js/pages/admin-products.js"></script>
    </head>
    <body>
        <div id="admin">
            <div id="sidebar"></div>
            <main class="admin-main">
                <div class="admin-head">
                    <p class="overline">Quản trị</p>
                    <h1 class="headline-section">Quản lý sản phẩm</h1>
                </div>

                <section class="admin-product-toolbar">
                    <div class="toolbar">
                        <label class="admin-search">
                            <span class="material-symbols-outlined">search</span>
                            <input class="input" type="search" id="txtAdminProductSearch" placeholder="Tìm theo tên hoặc mã sản phẩm...">
                        </label>
                        <select class="input" id="cboAdminProductStatus" aria-label="Lọc trạng thái">
                            <option value="">Tất cả trạng thái</option>
                            <option value="active">Đang hiển thị</option>
                            <option value="inactive">Đã ẩn</option>
                        </select>
                        <button class="btn" type="button" id="showProductFormButton">
                            <span class="material-symbols-outlined">add</span>
                            Thêm sản phẩm
                        </button>
                    </div>
                </section>

                <section class="admin-product-form card" id="productFormPanel" aria-labelledby="productFormTitle">
                    <div class="admin-section-heading">
                        <div>
                            <p class="overline">Danh mục sản phẩm</p>
                            <h2 class="headline-section" id="productFormTitle">Thông tin sản phẩm</h2>
                        </div>
                        <button class="btn-icon" type="button" id="closeProductFormButton" aria-label="Đóng biểu mẫu">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <form id="frmProduct">
                        <input type="hidden" id="txtProductId" name="id">
                        <div class="admin-form-grid">
                            <div class="form-group">
                                <label for="txtProductName">Tên sản phẩm</label>
                                <input class="input" type="text" id="txtProductName" name="name" required>
                            </div>
                            <div class="form-group">
                                <label for="txtProductBrand">Thương hiệu</label>
                                <input class="input" type="text" id="txtProductBrand" name="brand">
                            </div>
                            <div class="form-group">
                                <label for="cboProductCategory">Danh mục</label>
                                <select class="input" id="cboProductCategory" name="category_id" required>
                                    <option value="">Chọn danh mục</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="cboProductStyle">Phong cách</label>
                                <select class="input" id="cboProductStyle" name="style_id" required>
                                    <option value="">Chọn phong cách</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="txtProductPrice">Giá bán (₫)</label>
                                <input class="input" type="number" id="txtProductPrice" name="price" min="0" required>
                            </div>
                            <div class="form-group">
                                <label for="txtProductOriginalPrice">Giá gốc (₫)</label>
                                <input class="input" type="number" id="txtProductOriginalPrice" name="original_price" min="0">
                            </div>
                            <div class="form-group">
                                <label for="txtProductStock">Số lượng tồn kho</label>
                                <input class="input" type="number" id="txtProductStock" name="stock_quantity" min="0" required>
                            </div>
                            <div class="form-group">
                                <label for="txtProductDimensions">Kích thước</label>
                                <input class="input" type="text" id="txtProductDimensions" name="dimensions">
                            </div>
                            <div class="form-group">
                                <label for="txtProductMaterial">Chất liệu</label>
                                <input class="input" type="text" id="txtProductMaterial" name="material">
                            </div>
                            <div class="form-group">
                                <label for="txtProductColor">Màu sắc</label>
                                <input class="input" type="text" id="txtProductColor" name="color">
                            </div>
                            <div class="form-group admin-form-wide">
                                <label for="txtProductImages">Đường dẫn ảnh (mỗi dòng một đường dẫn)</label>
                                <textarea class="input" id="txtProductImages" name="images"></textarea>
                            </div>
                            <div class="form-group admin-form-wide">
                                <label for="txtProductModel">Đường dẫn model 3D (nếu có)</label>
                                <input class="input" type="text" id="txtProductModel" name="model_3d_url">
                            </div>
                            <div class="form-group admin-form-wide">
                                <label for="txtProductDescription">Mô tả</label>
                                <textarea class="input" id="txtProductDescription" name="description"></textarea>
                            </div>
                            <label class="admin-active-toggle">
                                <input type="checkbox" id="chkProductActive" name="is_active">
                                Hiển thị sản phẩm trên cửa hàng
                            </label>
                        </div>
                        <div class="admin-form-actions">
                            <button class="btn btn-outline" type="reset">Nhập lại</button>
                            <button class="btn" type="button" id="saveProductButton">Lưu sản phẩm</button>
                        </div>
                    </form>
                </section>

                <section class="admin-product-list">
                    <div class="admin-section-heading">
                        <div>
                            <p class="overline">Kho hàng</p>
                            <h2 class="headline-section">Danh sách sản phẩm</h2>
                        </div>
                        <p class="text-secondary" id="adminProductCount">Sản phẩm</p>
                    </div>
                    <div class="admin-table-wrap">
                        <table class="table admin-product-table">
                            <thead>
                                <tr>
                                    <th scope="col">Sản phẩm</th>
                                    <th scope="col">Danh mục</th>
                                    <th scope="col">Giá bán</th>
                                    <th scope="col">Tồn kho</th>
                                    <th scope="col">Trạng thái</th>
                                    <th scope="col">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="tbProducts">
                                <tr><td colspan="6" class="admin-table-empty">Danh sách sẽ hiển thị tại đây.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </main>
        </div>

        <script>
            loadData(initPage);
        </script>
    </body>
</html>
