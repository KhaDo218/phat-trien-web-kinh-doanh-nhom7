<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Đăng nhập - RoomCraft</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style type="text/css">
            @import url(css/base.css);
            @import url(css/pages/login.css);
        </style>
        <script src="js/core/utils.js"></script>
        <script src="js/core/store.js"></script>
        <script src="js/core/auth.js"></script>
        <script src="components/header.js"></script>
        <script src="components/footer.js"></script>
        <script src="components/chatbot.js"></script>
        <script src="js/pages/login.js"></script>
        <!-- Thư viện đăng nhập Google (Google Identity Services) -->
        <script src="https://accounts.google.com/gsi/client" async></script>
    </head>
    <body>
        <div id="header"></div>

        <main class="container subpage auth-page login-page">
            <aside class="login-showcase" aria-label="Không gian truyền cảm hứng RoomCraft">
                <div class="login-showcase-top">
                    <span>RoomCraft / Living 2026</span>
                    <span>Không gian 05</span>
                </div>
                <div class="login-showcase-copy">
                    <p class="overline">Sống cùng thiết kế</p>
                    <h2>Không gian đẹp bắt đầu từ cảm hứng đúng.</h2>
                    <p>Đăng nhập để lưu những món đồ yêu thích, tiếp tục giỏ hàng và theo dõi hành trình hoàn thiện căn phòng của bạn.</p>
                </div>
            </aside>
            <div class="auth-box card">
                <p class="overline">Chào mừng trở lại</p>
                <h1 class="headline-section">Đăng nhập</h1>

                <form name="frmLogin" onsubmit="return doLogin()">
                    <div class="form-group">
                        <label for="txtEmail">Email</label>
                        <input class="input" type="text" id="txtEmail" placeholder="email@example.com">
                    </div>
                    <div class="form-group">
                        <label for="txtPassword">Mật khẩu</label>
                        <input class="input" type="password" id="txtPassword" placeholder="Nhập mật khẩu">
                    </div>
                    <div class="auth-row">
                        <label><input type="checkbox" id="chkShow" onclick="showPassword()"> Hiện mật khẩu</label>
                        <a href="forgot-password.html">Quên mật khẩu?</a>
                    </div>
                    <p class="error-text" id="msgError"></p>
                    <input class="btn btn-full" type="submit" value="Đăng nhập">
                </form>

                <div class="auth-or"><span>hoặc</span></div>
                <!-- Nút Google do thư viện Google vẽ vào đây (xem renderGoogleButton trong login.js) -->
                <div id="googleButton"></div>

                <p class="auth-note">Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
            </div>
        </main>

        <div id="footer"></div>

        <script>
            loadData(initPage);
        </script>
    </body>
</html>
