<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Sản phẩm yêu thích - RoomCraft</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style type="text/css">
            @import url(css/base.css);
            @import url(css/components/product-card.css);
            @import url(css/pages/wishlist.css);
        </style>
        <script src="js/core/utils.js"></script>
        <script src="js/core/store.js"></script>
        <script src="js/core/auth.js"></script>
        <script src="components/header.js"></script>
        <script src="components/footer.js"></script>
        <script src="components/chatbot.js"></script>
        <script src="components/product-card.js"></script>
        <script src="js/services/products.js"></script>
        <script src="js/pages/wishlist.js"></script>
    </head>
    <body>
        <div id="header"></div>

        <main class="container subpage">
            <div class="breadcrumb"><a href="index.html">Trang chủ</a><span>/</span>Sản phẩm yêu thích</div>
            <h1 class="headline-page">Sản phẩm yêu thích</h1>

            <section class="wishlist-intro">
                <p class="lead">Những món đồ bạn đã lưu để hoàn thiện không gian sống.</p>
            </section>
            <section class="wishlist-content" aria-label="Danh sách sản phẩm yêu thích">
                <p class="text-secondary" id="wishlistCount"></p>
                <div class="grid-4 wishlist-grid" id="wishlistGrid"></div>
                <div class="empty wishlist-empty hidden" id="emptyWishlist">
                    <span class="material-symbols-outlined">favorite</span>
                    <h2 class="headline-section">Danh sách của bạn đang trống</h2>
                    <p>Các sản phẩm đã lưu sẽ xuất hiện tại đây.</p>
                    <a class="btn" href="products.html">Khám phá sản phẩm</a>
                </div>
            </section>

        </main>

        <div id="footer"></div>

        <script>
            loadData(initPage);
        </script>
    </body>
</html>
